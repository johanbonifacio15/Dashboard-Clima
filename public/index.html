<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard del clima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <header>
    <h1>Dashboard del clima</h1>
    <div class="controls">
      <form id="search" class="controls" role="search">
        <input id="q" type="search" placeholder="Buscar ciudad…" aria-label="Buscar ciudad" autocomplete="off">
        <button class="primary" type="submit">Buscar</button>
      </form>
      <button id="locate" type="button" title="Usar mi ubicación">Mi ubicación</button>
      <div class="seg" role="group" aria-label="Unidades">
        <button type="button" data-unit="celsius" aria-pressed="true">°C</button>
        <button type="button" data-unit="fahrenheit" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>

  <div id="suggestions" class="suggestions" hidden></div>
  <div id="status" class="panel state" role="status" aria-live="polite" hidden></div>

  <section id="dashboard" hidden>
    <div class="hero">
      <div class="panel">
        <p class="place" id="place"></p>
        <p class="temp"><span id="temp"></span><small id="unit"></small></p>
        <p class="cond" id="cond"></p>
      </div>
      <div class="panel">
        <dl>
          <div><dt>Sensación térmica</dt><dd id="feels"></dd></div>
          <div><dt>Humedad</dt><dd id="humidity"></dd></div>
          <div><dt>Viento</dt><dd id="wind"></dd></div>
          <div><dt>Lluvia hoy</dt><dd id="rain"></dd></div>
        </dl>
      </div>
    </div>
    <div class="charts">
      <div class="panel"><h2>Próximos 7 días</h2><div class="chart-box"><canvas id="dailyChart" aria-label="Temperatura máxima y mínima de los próximos 7 días" role="img"></canvas></div></div>
      <div class="panel"><h2>Próximas 24 horas</h2><div class="chart-box"><canvas id="hourlyChart" aria-label="Temperatura y probabilidad de lluvia por hora" role="img"></canvas></div></div>
    </div>
  </section>

  <footer>Datos de <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. No requiere API key.</footer>
</main>

<script src="js/app.js"></script>
</body>
</html>
