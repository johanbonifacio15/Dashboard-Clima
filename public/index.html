<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3b7a">
<title>Dashboard del clima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<main>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true">
        <rect width="32" height="32" rx="10" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.3)"/>
        <circle cx="21" cy="12" r="5" fill="#ffc857"/>
        <path d="M9 24a5 5 0 0 1 .8-9.9A6 6 0 0 1 21 16a4 4 0 0 1-.5 8z" fill="#fff"/>
      </svg>
      <h1>Dashboard del clima</h1>
    </div>

    <div class="controls">
      <form id="search" class="search" role="search">
        <input id="q" type="search" placeholder="Buscar ciudad…" aria-label="Buscar ciudad" autocomplete="off">
        <button class="primary" type="submit">Buscar</button>
      </form>
      <button id="locate" class="ghost" type="button" title="Usar mi ubicación">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
        Mi ubicación
      </button>
      <div class="seg" role="group" aria-label="Unidades">
        <button type="button" data-unit="celsius" aria-pressed="true">°C</button>
        <button type="button" data-unit="fahrenheit" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>

  <div id="suggestions" class="suggestions" hidden></div>
  <div id="status" class="panel state" role="status" aria-live="polite" hidden></div>

  <section id="dashboard" hidden>
    <div class="hero">
      <div class="current">
        <p class="place" id="place"></p>
        <div class="current-main">
          <span class="icon" id="icon" aria-hidden="true"></span>
          <p class="temp"><span id="temp"></span><small id="unit"></small></p>
        </div>
        <p class="cond" id="cond"></p>
      </div>

      <dl class="stats">
        <div class="stat">
          <dt>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>
            Sensación térmica
          </dt>
          <dd id="feels"></dd>
        </div>
        <div class="stat stat-bar">
          <dt>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg>
            Humedad
          </dt>
          <dd id="humidity"></dd>
        </div>
        <div class="stat">
          <dt>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>
            Viento
          </dt>
          <dd id="wind"></dd>
        </div>
        <div class="stat">
          <dt>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16a4 4 0 0 1-.5-7.9A6 6 0 0 1 18 9a3.5 3.5 0 0 1 0 7z"/><path d="M8 19v2M12 19v2M16 19v2"/></svg>
            Lluvia hoy
          </dt>
          <dd id="rain"></dd>
        </div>
      </dl>
    </div>

    <div class="charts">
      <div class="panel">
        <h2>Próximos 7 días</h2>
        <div class="chart-box"><canvas id="dailyChart" aria-label="Temperatura máxima y mínima de los próximos 7 días" role="img"></canvas></div>
      </div>
      <div class="panel">
        <h2>Próximas 24 horas</h2>
        <div class="chart-box"><canvas id="hourlyChart" aria-label="Temperatura y probabilidad de lluvia por hora" role="img"></canvas></div>
      </div>
    </div>
  </section>

  <footer>Datos del clima: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
</main>

<script src="js/app.js"></script>
</body>
</html>
